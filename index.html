<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AR CQB Trainer</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--panel:#121d28;--line:#2d4050;--cyan:#66d9e8;--text:#eaf2f7;--muted:#9fb0bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{padding:14px 16px;background:#0e1720;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.08em}
.brand small{display:block;color:var(--muted);font-size:11px}
main{max-width:1000px;margin:auto;padding:12px;display:grid;gap:12px}
.stage{position:relative;width:100%;aspect-ratio:4/3;max-height:68vh;min-height:260px;background:#101923;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#camera{position:absolute;width:100%;height:100%;object-fit:cover;inset:0;display:none}
#fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
#overlay{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:11px}
.hud span{background:#08111bdc;padding:6px;border-radius:4px}
.cross{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:.7}
.cross:before,.cross:after{content:"";position:absolute;background:#d6f5fa}
.cross:before{left:16px;top:0;width:1px;height:34px}
.cross:after{top:16px;left:0;height:1px;width:34px}
.surface-markers{position:absolute;inset:0;display:none}
.surface-dot{position:absolute;width:28px;height:28px;border:3px solid #ff3344;border-radius:50%;box-shadow:0 0 0 2px #ff334455,0 0 12px #ff3344;transform:translate(-50%,-50%)}
.surface-dot:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#ff3344}
.silhouette{position:absolute;width:72px;height:156px;left:66%;top:23%;opacity:.72;filter:drop-shadow(0 0 5px #63d8e8);display:none}
.silhouette svg{width:100%;height:100%}
.silhouette path,.silhouette circle{fill:rgba(45,181,205,.18);stroke:#75e8f3;stroke-width:2}
#tag{position:absolute;display:none;font-size:10px;color:#8bf1fb;background:#07131acc;border:1px solid #3f9eac;padding:4px;border-radius:4px}
#hitFlash{position:absolute;inset:0;background:#ff182b;opacity:0}
.hit #hitFlash{animation:flash .55s}
@keyframes flash{from{opacity:.5}to{opacity:0}}
#hitBanner{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 24px;border:2px solid #ff6971;background:#29090dcc;font-size:clamp(25px,6vw,44px);font-weight:900}
.hit #hitBanner{display:block}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{border:1px solid #3b5365;background:#1a2b39;color:white;padding:10px;border-radius:8px;font:inherit}
button.primary{background:#176273}
button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
select,input[type=range]{width:100%}
#status{color:var(--cyan);font-size:13px;margin-top:10px}
.note{font-size:11px;line-height:1.6;color:var(--muted)}
@media(max-width:600px){.stage{aspect-ratio:3/4;max-height:58vh}.panel{padding:11px}}
</style>
</head>
<body>
<header>
  <div class="brand">AR CQB TRAINER
    <small>CAMERA OVERLAY / PROTOTYPE 0.2</small>
  </div>
</header>

<main>
<section class="stage" id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <div id="fallback">カメラを起動してください</div>
  <div id="overlay">
    <div class="hud">
      <span>CAMERA VIEW</span>
      <span id="clock">00:00</span>
    </div>
    <div class="cross"></div>
    <div class="surface-markers" id="surfaceMarkers"></div>
    <div class="silhouette" id="silhouette">
      <svg viewBox="0 0 80 170">
        <circle cx="40" cy="18" r="12"/>
        <path d="M29 34 Q40 29 51 34 L58 76 L51 83 L49 61 L54 105 L48 108 L45 78 L44 119 L49 160 L39 160 L34 122 L28 160 L18 160 L25 108 L22 78 L18 104 L12 101 L20 57 L17 79 L11 76 L18 39 Q22 34 29 34Z"/>
      </svg>
    </div>
    <div id="tag">SIMULATION</div>
    <div id="hitFlash"></div>
    <div id="hitBanner">HIT!</div>
  </div>
</section>

<section class="panel">
  <div class="row">
    <button class="primary" id="cameraBtn">📷 カメラ起動</button>
    <button class="primary" id="startBtn">▶ 練習開始</button>
    <button id="stopBtn" disabled>■ 停止</button>
    <button id="resetBtn">↻ リセット</button>
  </div>

  <div id="status">待機中</div>

  <div class="grid">
    <div>
      <label for="surfaceDetect">赤丸マーカー</label>
      <select id="surfaceDetect">
        <option value="off" selected>OFF</option>
        <option value="on">ON（静止構造エッジ検出）</option>
      </select>
    </div>
    <div>
      <label for="interval">イベント間隔</label>
      <select id="interval">
        <option value="8">短め</option>
        <option value="15" selected>標準</option>
        <option value="25">長め</option>
      </select>
    </div>
    <div>
      <label for="duration">警告音の長さ</label>
      <select id="duration">
        <option value=".25">短い</option>
        <option value=".6" selected>標準</option>
        <option value="1.1">長い</option>
      </select>
    </div>
    <div>
      <label for="volume">警告音の音量</label>
      <input id="volume" type="range" min="0" max="100" value="55">
      <span id="volLabel">55%</span>
    </div>
  </div>

  <p class="note">
    動体差分（人の動き）を除外した静止輪郭（壁・角・遮蔽物）のエッジを強調検出します。
    動体や一変した空間誤認識を抑制するためSobel勾配フィルタとフレーム間差分判定を適用しています。
    カメラ映像はページ内で処理し、外部へ送信しません。
    カメラ利用にはHTTPSと許可が必要です。
  </p>
</section>

<section class="panel">
  <strong>セッション情報</strong>
  <p>経過時間：<span id="elapsed">00:00</span></p>
  <p>HIT回数：<span id="hits">0</span></p>
  <p>影の表示回数：<span id="contacts">0</span></p>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const video=$('camera');
const stage=$('stage');
const shadow=$('silhouette');

let stream=null;
let running=false;
let timer=null;
let clockTimer=null;
let startAt=0;
let hits=0;
let contacts=0;
let audio=null;
let detectTimer=null;

const detectorCanvas=document.createElement('canvas');
const detectorCtx=detectorCanvas.getContext('2d',{
  willReadFrequently:true
});

let prevLumFrame=null;

function fmt(seconds){
  seconds=Math.max(0,Math.floor(seconds));
  return String(Math.floor(seconds/60)).padStart(2,'0')+':'+
    String(seconds%60).padStart(2,'0');
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error('HTTPS対応のSafariで開いてください');
    }

    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });

    video.srcObject=stream;
    video.style.display='block';
    $('fallback').style.display='none';
    await video.play();

    $('cameraBtn').textContent='✓ カメラ起動中';
    $('status').textContent='カメラ起動中';
    startVisualMarkers();
  }catch(error){
    $('status').textContent='カメラを起動できません：'+error.message;
  }
}

/* 映像のSobelエッジ検出 ＋ 動体差分判定（人物や空間誤判定の除外） */
function startVisualMarkers(){
  clearInterval(detectTimer);

  detectTimer=setInterval(()=>{
    const layer=$('surfaceMarkers');

    if($('surfaceDetect').value!=='on' ||
        !stream || video.readyState<2){
      layer.style.display='none';
      layer.innerHTML='';
      prevLumFrame=null;
      return;
    }

    try{
      const w=160,h=120;
      detectorCanvas.width=w;
      detectorCanvas.height=h;
      detectorCtx.drawImage(video,0,0,w,h);

      const frame=detectorCtx.getImageData(0,0,w,h).data;
      const currentLum=new Float32Array(w*h);

      for(let i=0;i<w*h;i++){
        const idx=i*4;
        currentLum[i]=0.299*frame[idx]+0.587*frame[idx+1]+0.114*frame[idx+2];
      }

      const isMotion=new Uint8Array(w*h);
      if(prevLumFrame && prevLumFrame.length===w*h){
        for(let i=0;i<w*h;i++){
          if(Math.abs(currentLum[i]-prevLumFrame[i])>18){
            isMotion[i]=1;
          }
        }
      }
      prevLumFrame=currentLum;

      const candidates=[];

      for(let y=2;y<h-2;y+=4){
        for(let x=2;x<w-2;x+=4){
          let motionSum=0;
          for(let my=-1;my<=1;my++){
            for(let mx=-1;mx<=1;mx++){
              motionSum+=isMotion[(y+my)*w+(x+mx)];
            }
          }
          if(motionSum>2) continue;

          const p0=currentLum[(y-1)*w+(x-1)], p1=currentLum[(y-1)*w+x], p2=currentLum[(y-1)*w+(x+1)];
          const p3=currentLum[y*w+(x-1)],                         p5=currentLum[y*w+(x+1)];
          const p6=currentLum[(y+1)*w+(x-1)], p7=currentLum[(y+1)*w+x], p8=currentLum[(y+1)*w+(x+1)];

          const gx=(-1*p0 + 1*p2 + -2*p3 + 2*p5 + -1*p6 + 1*p8);
          const gy=(-1*p0 - 2*p1 - 1*p2 + 1*p6 + 2*p7 + 1*p8);
          const edgeStrength=Math.hypot(gx,gy);

          if(edgeStrength>180){
            candidates.push({x,y,score:edgeStrength});
          }
        }
      }

      candidates.sort((a,b)=>b.score-a.score);
      const chosen=[];

      for(const c of candidates){
        if(chosen.every(q=>Math.hypot(q.x-c.x,q.y-c.y)>22)){
          chosen.push(c);
        }
        if(chosen.length>=5)break;
      }

      layer.innerHTML='';

      chosen.forEach(c=>{
        const dot=document.createElement('div');
        dot.className='surface-dot';
        dot.style.left=(c.x/w*100)+'%';
        dot.style.top=(c.y/h*100)+'%';
        layer.appendChild(dot);
      });

      layer.style.display='block';
    }catch(error){
      layer.style.display='none';
    }
  },350);
}

function beep(){
  try{
    audio=audio||new(
      window.AudioContext||window.webkitAudioContext
    )();

    if(audio.state==='suspended')audio.resume();

    const duration=Number($('duration').value);
    const volume=Number($('volume').value)/100;
    const osc=audio.createOscillator();
    const gain=audio.createGain();

    osc.type='square';
    osc.frequency.setValueAtTime(880,audio.currentTime);
    osc.frequency.setValueAtTime(
      660,audio.currentTime+duration*.45
    );

    gain.gain.setValueAtTime(
      Math.max(.0001,volume*.22),audio.currentTime
    );
    gain.gain.exponentialRampToValueAtTime(
      .0001,audio.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+duration);
  }catch(error){
    $('status').textContent='音声を再生できませんでした';
  }
}

function showEvent(){
  if(!running)return;

  const x=10+Math.random()*75;
  const y=14+Math.random()*40;

  shadow.style.left=x+'%';
  shadow.style.top=y+'%';
  shadow.style.display='block';
  $('tag').style.left=Math.min(x+8,75)+'%';
  $('tag').style.top=Math.max(5,y-3)+'%';
  $('tag').style.display='block';

  contacts++;
  $('contacts').textContent=contacts;

  setTimeout(()=>{
    if(!running)return;

    stage.classList.add('hit');
    hits++;
    $('hits').textContent=hits;
    $('status').textContent='シミュレーションイベント：HIT!';
    beep();

    setTimeout(()=>{
      stage.classList.remove('hit');
      shadow.style.display='none';
      $('tag').style.display='none';

      if(running){
        $('status').textContent='練習中';
        scheduleNext();
      }
    },850);
  },1500+Math.random()*2500);
}

function scheduleNext(){
  if(!running)return;
  const base=Number($('interval').value);
  timer=setTimeout(showEvent,(base+Math.random()*base)*1000);
}

function start(){
  if(running)return;

  running=true;
  startAt=Date.now();
  $('startBtn').disabled=true;
  $('stopBtn').disabled=false;
  $('cameraBtn').disabled=!!stream;
  $('status').textContent='練習開始 — 自動イベント待機中';

  if(audio&&audio.state==='suspended')audio.resume();

  scheduleNext();

  clockTimer=setInterval(()=>{
    const elapsed=(Date.now()-startAt)/1000;
    $('elapsed').textContent=fmt(elapsed);
    $('clock').textContent=fmt(elapsed);
  },250);
}

function stop(){
  running=false;
  clearTimeout(timer);
  clearInterval(clockTimer);
  $('startBtn').disabled=false;
  $('stopBtn').disabled=true;
  shadow.style.display='none';
  $('tag').style.display='none';
  stage.classList.remove('hit');
  $('status').textContent='停止しました';
}

function reset(){
  stop();
  hits=0;
  contacts=0;
  $('hits').textContent='0';
  $('contacts').textContent='0';
  $('elapsed').textContent='00:00';
  $('clock').textContent='00:00';
  $('status').textContent='リセットしました';
}

$('cameraBtn').addEventListener('click',startCamera);
$('startBtn').addEventListener('click',start);
$('stopBtn').addEventListener('click',stop);
$('resetBtn').addEventListener('click',reset);

$('volume').addEventListener('input',()=>{
  $('volLabel').textContent=$('volume').value+'%';
});

$('surfaceDetect').addEventListener('change',()=>{
  if($('surfaceDetect').value==='off'){
    $('surfaceMarkers').style.display='none';
    $('surfaceMarkers').innerHTML='';
  }else if(stream){
    startVisualMarkers();
  }
});

window.addEventListener('pagehide',()=>{
  clearInterval(detectTimer);
  if(stream)stream.getTracks().forEach(track=>track.stop());
});
</script>
</body>
</html>
